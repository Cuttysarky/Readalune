name: Release

# Builds the installers for Windows, macOS and Linux.
#  - Push a tag such as v1.0.0 to build them and create a *draft* GitHub release
#    (nothing is published until a maintainer reviews the draft and presses Publish).
#  - Or run it by hand from the Actions tab with "Create a draft release" ticked. It builds
#    the version in package.json and drafts the release; publishing the draft creates the tag.
#  - Run it by hand without that box to build test installers only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide what to build
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_DRAFT: ${{ inputs.draft_release }}
        run: |
          version="v$(jq -r .version package.json)"
          tag="$version"; build=true; release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::The tag $tag does not match the version in package.json ($version)."
              exit 1
            fi
            release=true
          elif [[ "$WANT_DRAFT" == "true" ]]; then
            release=true
          fi
          # A published release for this version was already built by an earlier run: publishing a
          # draft made by hand creates the tag, which starts this workflow again with nothing to do.
          if [[ "$release" == "true" ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $tag already exists. Nothing to build."
            build=false; release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Plan: tag=$tag build=$build release=$release"

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64
          - name: Linux
            os: ubuntu-24.04
            args: --linux --x64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Security check and unit tests
        run: |
          npm run check
          npm test
      - name: Build installers
        # Unsigned unless signing certificates are configured (see docs/RELEASING.md).
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readalune-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          # This version's section of the changelog, without its heading.
          awk -v v="$version" 'index($0, "## " v) == 1 { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloading

          The [README](REPO_URL/README.md#download) says which file is for your computer. These installers are not code-signed, so Windows and macOS show a warning the first time you open Readalune; the README explains how to continue, and `SHA256SUMS.txt` lets you check your download.

          ## Legal

          Readalune is free software under the MIT License. The bundled classics come from Project Gutenberg, which lists them as public domain in the United States; copyright terms differ between countries, so check the rules where you live. See [LEGAL.md](REPO_URL/LEGAL.md) and [CLASSICS.md](REPO_URL/CLASSICS.md). Readalune is not affiliated with Amazon, Kindle or Project Gutenberg.
          EOF
          # Links in release notes must be absolute.
          sed -i "s#REPO_URL#${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}#g" notes.md
          cat notes.md
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A draft from an earlier run: replace its files.
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Readalune ${TAG#v}" --notes-file notes.md
          fi
